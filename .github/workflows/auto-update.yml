name: Update IP Rule-Set and Release

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0:00 自动运行
  workflow_dispatch:      # 支持手动点击运行

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # 赋予删除和创建 Release / Tag 的权限

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run IP Aggregator Script
        run: |
          python aggregate.py

      - name: Install sing-box
        run: |
          bash <(curl -fsSL https://sing-box.app/deb-install.sh)
          sing-box version

      - name: Compile JSON to SRS
        run: |
          sing-box rule-set compile output/geoip-cn.json -o output/geoip-cn.srs
          echo "Compiled geoip-cn.srs successfully"

      - name: Delete Old Release and Tag
        run: |
          # 如果之前存在名为 latest 的 Release 或 Tag，将其彻底清理
          gh release delete latest --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create New Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "China IP Rule Set (Latest)"
          body: |
            Automatic update of China Mainland IP rules.
            Last Updated: ${{ github.event.repository.updated_at }}
          draft: false
          prerelease: false
          files: |
            cn_ipv4.txt
            cn_ipv6.txt
            geoip-cn.json
            geoip-cn.srs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
