name: Update IP Rule-Set and Release

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0:00 自动运行
  workflow_dispatch:      # 支持手动点击运行

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # 赋予删除和创建 Release / Tag 的权限

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run IP Aggregator Script
        run: |
          python update.py

      - name: Install sing-box
        run: |
          SING_BOX_VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep -oP '"tag_name": "\K[^"]+')
          VERSION_NUM=${SING_BOX_VERSION#v}
          curl -LO "https://github.com/SagerNet/sing-box/releases/download/${SING_BOX_VERSION}/sing-box-${VERSION_NUM}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${VERSION_NUM}-linux-amd64.tar.gz"
          sudo mv "sing-box-${VERSION_NUM}-linux-amd64/sing-box" /usr/local/bin/

      - name: Compile sing-box Rule-set (.srs)
        run: |
          sing-box rule-set compile geoip-cn.json -o geoip-cn.srs

      - name: Delete Old Release and Tag
        run: |
          # 如果之前存在名为 latest 的 Release 或 Tag，将其彻底清理
          gh release delete latest --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create New Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "China IP Rule Set (Latest)"
          body: |
            Automatic update of China Mainland IP rules.
            Last Updated: ${{ github.event.repository.updated_at }}
          draft: false
          prerelease: false
          files: |
            cn_ipv4.txt
            cn_ipv6.txt
            geoip-cn.json
            geoip-cn.srs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
